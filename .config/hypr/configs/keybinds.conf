# Hyprland Keybinds Configuration
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

## Variables

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$hyprDir = $HOME/.config/hypr
$screenshot = $scriptsDir/screenshot.sh
$screenshotAll = $scriptsDir/screenshot_all.sh
$terminal = kitty
$menu = $scriptsDir/menu
$lock = $scriptsDir/hyprlock.sh
$suspend = $scriptsDir/hyprlock.sh suspend
$floatAll = hyprctl dispatch workspaceopt allfloat
$keyboardLayout = $scriptsDir/dvorak-qwerty.sh
$statusBar = $scriptsDir/bar.sh
$monitor = `hyprctl monitors | awk '/Monitor/ {monitor=$2} /focused: yes/ {print monitor}'`


## Window Manipulation

# fullscreen
bind = $mainMod, F, fullscreen
# close window
bind = $mainMod, Q, killactive
# toggle floating
bind = $mainMod, Space, togglefloating
# pin window
bind = $mainMod CTRL, Space, pin


## Open Apps

# open terminal
bind = $mainMod, Return, exec, $terminal
# open floating terminal
bind = $mainMod CTRL, Return, exec, [float] $terminal
# open onedrive
bind = $mainMod, O, exec, $terminal $hyprDir/onedrive/onedrive
# open btop
bind = $mainMod, P, exec, [workspace 5] $terminal btop


## AGS Bar and Panels

# restart status bar
bind = $mainMod, B, exec, $statusBar
# app launcher
bind = $mainMod, SUPER_L, exec, ags toggle app-launcher-$monitor
# media widget
bind = $mainMod, m, exec, ags toggle media-$monitor
# right panel
bind = $mainMod, r, exec, ags toggle right-panel-$monitor
# left panel
bind = $mainMod, l, exec, ags toggle left-panel-$monitor
# wallpaper switcher
bind = $mainMod, W, exec, ags toggle wallpaper-switcher-$monitor
# settings panel
bind = $mainMod ALT, S, exec, ags toggle settings-$monitor
# user panel
bind = $mainMod, Escape, exec, ags toggle user-panel-$monitor


## Media and Volume Control

# volume up (Alt+F12)
bindel = ALT, F12, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# volume down (Alt+F11)
bindel = ALT, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# volume up (media key)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# volume down (media key)
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# mute toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


## Brightness Control

# brightness up (Alt+F3)
bindel = ALT, F3, exec, brightnessctl set +10%
# brightness down (Alt+F2)
bindel = ALT, F2, exec, brightnessctl set 10%-
# brightness up (media key)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
# brightness down (media key)
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-


## Lock and Suspend

# lock screen
bind = $mainMod SHIFT, Escape, exec, $lock
# suspend
bind = $mainMod CTRL, Escape, exec, $suspend
# shutdown
bind = $mainMod CTRL SHIFT, Escape, exec, shutdown now


## Resize Window

# resize left (arrow)
binde = $mainMod SHIFT, left, resizeactive,-50 0
# resize right (arrow)
binde = $mainMod SHIFT, right, resizeactive,50 0
# resize up (arrow)
binde = $mainMod SHIFT, up, resizeactive,0 -50
# resize down (arrow)
binde = $mainMod SHIFT, down, resizeactive,0 50
# resize left (vim)
binde = $mainMod SHIFT, H, resizeactive,-50 0
# resize right (vim)
binde = $mainMod SHIFT, N, resizeactive,50 0
# resize up (vim)
binde = $mainMod SHIFT, C, resizeactive,0 -50
# resize down (vim)
binde = $mainMod SHIFT, T, resizeactive,0 50


## Move Window

# move left (arrow)
bind = $mainMod CTRL, left, movewindow, l
# move right (arrow)
bind = $mainMod CTRL, right, movewindow, r
# move up (arrow)
bind = $mainMod CTRL, up, movewindow, u
# move down (arrow)
bind = $mainMod CTRL, down, movewindow, d
# move left (vim)
bind = $mainMod CTRL, h, movewindow, l
# move right (vim)
bind = $mainMod CTRL, n, movewindow, r
# move up (vim)
bind = $mainMod CTRL, c, movewindow, u
# move down (vim)
bind = $mainMod CTRL, t, movewindow, d


## Move Focus

# focus left (arrow)
bind = $mainMod, left, movefocus, l
# focus right (arrow)
bind = $mainMod, right, movefocus, r
# focus up (arrow)
bind = $mainMod, up, movefocus, u
# focus down (arrow)
bind = $mainMod, down, movefocus, d
# focus left (vim)
bind = $mainMod, h, movefocus, l
# focus right (vim)
bind = $mainMod, n, movefocus, r
# focus up (vim)
bind = $mainMod, c, movefocus, u
# focus down (vim)
bind = $mainMod, t, movefocus, d


## Special Workspace

# move to special workspace
bind = SUPER CTRL,S,movetoworkspace,special
# toggle special workspace
bind = SUPER,S,togglespecialworkspace


## Switch Workspaces

# workspace 1
bind = $mainMod, 1, workspace, 1
# workspace 2
bind = $mainMod, 2, workspace, 2
# workspace 3
bind = $mainMod, 3, workspace, 3
# workspace 4
bind = $mainMod, 4, workspace, 4
# workspace 5
bind = $mainMod, 5, workspace, 5
# workspace 6
bind = $mainMod, 6, workspace, 6
# workspace 7
bind = $mainMod, 7, workspace, 7
# workspace 8
bind = $mainMod, 8, workspace, 8
# workspace 9
bind = $mainMod, 9, workspace, 9
# workspace 10
bind = $mainMod, 0, workspace, 10
# previous workspace
bind = $mainMod, TAB, workspace, previous


## Move Window to Workspace

# move to workspace 1
bind = $mainMod CTRL, 1, movetoworkspace, 1
# move to workspace 2
bind = $mainMod CTRL, 2, movetoworkspace, 2
# move to workspace 3
bind = $mainMod CTRL, 3, movetoworkspace, 3
# move to workspace 4
bind = $mainMod CTRL, 4, movetoworkspace, 4
# move to workspace 5
bind = $mainMod CTRL, 5, movetoworkspace, 5
# move to workspace 6
bind = $mainMod CTRL, 6, movetoworkspace, 6
# move to workspace 7
bind = $mainMod CTRL, 7, movetoworkspace, 7
# move to workspace 8
bind = $mainMod CTRL, 8, movetoworkspace, 8
# move to workspace 9
bind = $mainMod CTRL, 9, movetoworkspace, 9
# move to workspace 10
bind = $mainMod CTRL, 0, movetoworkspace, 10


## Move Window Silently

# silent move to workspace 1
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
# silent move to workspace 2
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
# silent move to workspace 3
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
# silent move to workspace 4
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
# silent move to workspace 5
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
# silent move to workspace 6
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
# silent move to workspace 7
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
# silent move to workspace 8
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
# silent move to workspace 9
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
# silent move to workspace 10
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10


## Scroll Through Workspaces

# next workspace (scroll down)
bind = $mainMod, mouse_down, workspace, e+1
# previous workspace (scroll up)
bind = $mainMod, mouse_up, workspace, e-1


## Mouse Window Control

# move window with mouse
bindm = $mainMod, mouse:272, movewindow
# resize window with mouse
bindm = $mainMod, mouse:273, resizewindow


## Screenshot Keybindings

# screenshot workspace
bind = $mainMod SHIFT, S, exec, $screenshot --now
# screenshot area
bind = $mainMod SHIFT, Z, exec, $screenshot --area
# screenshot all workspaces
bind = $mainMod CTRL SHIFT, A, exec, $screenshot --all


## Discretion Mode

# toggle discretion mode
bind = $mainMod SHIFT, D, exec, $scriptsDir/discretion-mode.sh toggle


## Keyboard Layout

# toggle keyboard layout
bind = ALT, F10, exec, $keyboardLayout


## Plugins

# toggle expo
bind = SUPER SHIFT, TAB, hyprexpo:expo, toggle


## Gestures

gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, togglespecialworkspace
gesture = 3, down, dispatcher, togglespecialworkspace
gesture = 4, up, fullscreen
gesture = 4, down, fullscreen
gesture = 4, right, float
gesture = 4, left, float
