# Claude Code Integration Keybinds
# These keybinds make it easy to paste images into Claude Code

# Super+Alt+V - Smart paste helper for Claude Code
# Automatically copies "Read /path/to/image" command when you have an image
bind = $mainMod ALT, V, exec, $scriptsDir/claude-paste-helper.sh auto

# Super+Alt+C - Copy current clipboard image and get command
bind = $mainMod ALT, C, exec, $scriptsDir/claude-paste-helper.sh save

# Super+Alt+I - Show Claude paste helper status
bind = $mainMod ALT, I, exec, $scriptsDir/claude-paste-helper.sh status | zenity --text-info --width=600 --height=400 --title="Claude Helper Status" 2>/dev/null || notify-send "Claude Helper" "$($scriptsDir/claude-paste-helper.sh status)"

# Alternative: Direct screenshot to Claude command
# Takes a screenshot and immediately copies the Read command
# Changed from Super+Alt+S to Super+Alt+P (S is used by AGS settings)
bind = $mainMod ALT, P, exec, $scriptsDir/screenshot.sh --area && sleep 0.5 && $scriptsDir/claude-paste-helper.sh auto