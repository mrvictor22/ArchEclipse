plugin:hyprexpo {
        columns = 3
        gap_size = 1
        bg_col = rgb(000000)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1
        gesture_distance = 300 # how far is the "max"
}

# Gesture disabled: 3-finger up already used for togglespecialworkspace in general.conf
# Use keybind instead (SUPER+grave or configured bind)
# hyprexpo-gesture = 3, up, expo
