# Keybinds opcionales para Workspace State Manager
# Agrega estas líneas a tu ~/.config/hypr/configs/keybinds.conf si deseas controles manuales

# Guardar estado actual de workspaces (útil antes de cambiar KVM manualmente)
bind = $mainMod SHIFT, F9, exec, ~/.config/hypr/scripts/workspace-state-manager.sh save && notify-send "Workspace State" "Estado guardado"

# Restaurar estado de workspaces (útil después de volver del KVM)
bind = $mainMod SHIFT, F10, exec, ~/.config/hypr/scripts/workspace-state-manager.sh restore && notify-send "Workspace State" "Estado restaurado"

# Ver estado guardado vs actual (para debugging)
bind = $mainMod SHIFT, F11, exec, kitty --hold -e bash -c '~/.config/hypr/scripts/workspace-state-manager.sh show && echo "" && echo "=== ESTADO ACTUAL ===" && ~/.config/hypr/scripts/workspace-state-manager.sh current'
